[package]
name = "gambito"
version = "0.2.0"
edition = "2024"
rust-version = "1.95"
license = "GPL-3.0-or-later"
description = "Keyboard-first Lichess client for tiling desktops: Rust daemon, Qt Quick UI, Stockfish analysis"

[dependencies]
anyhow = "1"
base64 = "0.23.1"
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
reqwest = { version = "0.13", features = ["json", "stream", "form"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.0"
shakmaty = "0.30"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }

[dev-dependencies]
tempfile = "3"
