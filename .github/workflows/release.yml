name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    env:
      TARGET: x86_64-unknown-linux-gnu
      ASSET: gambito-linux-x86_64.tar.gz
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.TARGET }}
      - name: Build
        run: cargo build --release --target ${{ env.TARGET }}
      - name: Package
        run: |
          mkdir -p package/ui
          cp target/${{ env.TARGET }}/release/gambito package/gambito
          cp ui/*.qml package/ui/
          tar -czf ${{ env.ASSET }} -C package .
          sha256sum ${{ env.ASSET }} > ${{ env.ASSET }}.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ASSET }}
          path: |
            ${{ env.ASSET }}
            ${{ env.ASSET }}.sha256

  publish:
    needs: linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
